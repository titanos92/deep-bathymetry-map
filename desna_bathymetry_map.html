<head>
    
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    
<style>


/* ==========================================================
   ПІДПИСИ ГЛИБИН
========================================================== */

.depth-label {

    color: #444;

    font-family: Arial, sans-serif;

    font-size: 16px;

    font-weight: 700;

    text-align: center;

    white-space: nowrap;

    text-shadow:
        -2px -2px 2px white,
         2px -2px 2px white,
        -2px  2px 2px white,
         2px  2px 2px white,
         0 0 4px white;

    pointer-events: none;
}


/* ==========================================================
   НАСЕЛЕНІ ПУНКТИ
========================================================== */

.settlement-label {

    color: #222;

    font-family: Arial, sans-serif;

    text-align: center;

    white-space: nowrap;

    text-shadow:
        -2px -2px 2px white,
         2px -2px 2px white,
        -2px  2px 2px white,
         2px  2px 2px white,
         0 0 6px white;

    pointer-events: none;
}


/* ==========================================================
   POPUP ГЛИБИНИ
========================================================== */

.depth-click-popup
.leaflet-popup-content-wrapper {

    border-radius: 15px;

    box-shadow:
        0 3px 13px rgba(0,0,0,0.30);
}


.depth-click-popup
.leaflet-popup-content {

    margin: 12px 17px;
}


.depth-click-value {

    font-family: Arial, sans-serif;

    font-size: 22px;

    font-weight: 700;

    white-space: nowrap;
}


/* ==========================================================
   КООРДИНАТИ
========================================================== */

.coord-popup
.leaflet-popup-content-wrapper {

    border-radius: 15px;
}


.coord-value {

    font-family: Arial, sans-serif;

    font-size: 18px;

    white-space: nowrap;
}


/* ==========================================================
   ЄДИНИЙ ПРАВИЙ БЛОК
========================================================== */

.desna-control {

    position: relative;
}


.desna-buttons {

    display: flex;

    flex-direction: column;

    gap: 7px;
}


.desna-button {

    width: 46px;

    height: 46px;

    border: 0;

    border-radius: 9px;

    background: white;

    box-shadow:
        0 1px 6px rgba(0,0,0,0.40);

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #333;

    font-family: Arial, sans-serif;

    font-size: 21px;

    font-weight: 700;

    padding: 0;
}


.desna-button:hover {

    background: #f5f5f5;
}


.desna-button.active {

    background: #e5f4ff;

    box-shadow:
        0 0 0 2px #168ac5;
}


/* ==========================================================
   ПАНЕЛІ
========================================================== */

.desna-panel {

    position: absolute;

    right: 56px;

    display: none;

    background: rgba(255,255,255,0.97);

    border-radius: 11px;

    padding: 12px 14px;

    box-shadow:
        0 2px 12px rgba(0,0,0,0.28);

    font-family: Arial, sans-serif;

    color: #222;
}


.desna-panel.visible {

    display: block;
}


.layers-panel {

    top: 0;

    width: 190px;
}


.depth-panel {

    top: 53px;

    width: 140px;
}


.panel-title {

    font-size: 16px;

    font-weight: 700;

    margin-bottom: 10px;
}


.layer-row {

    display: flex;

    align-items: center;

    gap: 9px;

    margin: 9px 0;

    font-size: 14px;

    white-space: nowrap;
}


.layer-row input {

    width: 17px;

    height: 17px;

    cursor: pointer;
}


.depth-row {

    display: flex;

    align-items: center;

    gap: 8px;

    margin: 4px 0;

    font-size: 13px;
}


.depth-box {

    width: 29px;

    height: 14px;

    flex-shrink: 0;
}


/* ==========================================================
   ЛІНІЙКА
========================================================== */

.measure-distance-label {

    background: white;

    border: 0;

    border-radius: 8px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.30);

    color: #222;

    font-family: Arial, sans-serif;

    font-size: 16px;

    font-weight: 700;

    padding: 5px 8px;
}


.measure-distance-label:before {

    display: none;
}

// ==========================================================
// КЛІК -> ГЛИБИНА
// ==========================================================

bathyLayer.eachLayer(
    function(layer) {

        layer.on(
            "click",
            function(e) {

                if (
                    window.simpleMeasureActive
                ) {
                    return;
                }


                L.DomEvent.stopPropagation(e);


                var properties =
                    layer.feature.properties || {};


                var depth =
                    properties.depth_m;


                if (
                    depth === null ||
                    depth === undefined
                ) {
                    return;
                }


                var popupHtml =
                    '<div class="depth-click-value">'
                    + Number(depth).toFixed(1)
                    + ' m</div>';


                L.popup({
                    closeButton: false,
                    className:
                        "depth-click-popup"
                })

                .setLatLng(
                    e.latlng
                )

                .setContent(
                    popupHtml
                )

                .openOn(
                    mapObj
                );
            }
        );


        // ==================================================
        // ПРАВИЙ КЛІК -> КООРДИНАТИ
        // ==================================================

        layer.on(
            "contextmenu",
            function(e) {

                if (
                    window.simpleMeasureActive
                ) {
                    return;
                }


                L.DomEvent.stopPropagation(e);


                var lat =
                    e.latlng.lat.toFixed(6);

                var lon =
                    e.latlng.lng.toFixed(6);


                var popupHtml =
                    '<div class="coord-value">'
                    + lat
                    + ', '
                    + lon
                    + '</div>';


                L.popup({
                    closeButton: true,
                    className:
                        "coord-popup"
                })

                .setLatLng(
                    e.latlng
                )

                .setContent(
                    popupHtml
                )

                .openOn(
                    mapObj
                );
            }
        );
    }
);

var measurePointA = null;

var measureMarkerA = null;

var measureMarkerB = null;

var measureLine = null;

var measureTooltip = null;


function clearMeasurement() {

    var layers = [

        measureMarkerA,

        measureMarkerB,

        measureLine,

        measureTooltip

    ];


    layers.forEach(
        function(layer) {

            if (
                layer
                &&
                mapObj.hasLayer(layer)
            ) {

                mapObj.removeLayer(layer);
            }
        }
    );


    measurePointA = null;

    measureMarkerA = null;

    measureMarkerB = null;

    measureLine = null;

    measureTooltip = null;
}


function formatDistance(meters) {

    if (meters < 1000) {

        return (
            Math.round(meters)
            + " м"
        );
    }


    return (
        (meters / 1000).toFixed(2)
        + " км"
    );
}

// ==========================================================
// КЛІКИ ЛІНІЙКИ A -> B
// ==========================================================

mapObj.on(
    "click",
    function(e) {

        if (
            !window.simpleMeasureActive
        ) {
            return;
        }


        // ==================================================
        // A
        // ==================================================

        if (
            measurePointA === null
        ) {

            measurePointA =
                e.latlng;


            measureMarkerA =
                L.circleMarker(
                    measurePointA,
                    {
                        radius: 5,
                        color: "#ffffff",
                        weight: 2,
                        fillColor: "#ff3333",
                        fillOpacity: 1
                    }
                )
                .addTo(
                    mapObj
                );


            return;
        }


        // ==================================================
        // B
        // ==================================================

        var pointB =
            e.latlng;


        measureMarkerB =
            L.circleMarker(
                pointB,
                {
                    radius: 5,
                    color: "#ffffff",
                    weight: 2,
                    fillColor: "#ff3333",
                    fillOpacity: 1
                }
            )
            .addTo(
                mapObj
            );


        // ==================================================
        // ЛІНІЯ A-B
        // ==================================================

        measureLine =
            L.polyline(
                [
                    measurePointA,
                    pointB
                ],
                {
                    color: "#ff3333",
                    weight: 3,
                    opacity: 0.95
                }
            )
            .addTo(
                mapObj
            );


        // ==================================================
        // ВІДСТАНЬ
        // ==================================================

        var meters =
            mapObj.distance(
                measurePointA,
                pointB
            );


        // ==================================================
        // СЕРЕДИНА ЛІНІЇ
        // ==================================================

        var middle =
            L.latLng(
                (
                    measurePointA.lat
                    + pointB.lat
                ) / 2,

                (
                    measurePointA.lng
                    + pointB.lng
                ) / 2
            );


        // ==================================================
        // ПОКАЗУЄМО ТІЛЬКИ ВІДСТАНЬ
        // ==================================================

        measureTooltip =
            L.tooltip({
                permanent: true,
                direction: "top",
                className:
                    "measure-distance-label",
                offset: [0, -4]
            })

            .setLatLng(
                middle
            )

            .setContent(
                formatDistance(
                    meters
                )
            )

            .addTo(
                mapObj
            );


        // ==================================================
        // ЗАВЕРШУЄМО
        // ==================================================

        window.simpleMeasureActive =
            false;


        if (
            window.desnaRulerButton
        ) {

            window.desnaRulerButton
                .classList
                .remove("active");
        }


        mapObj
            .getContainer()
            .style.cursor = "";
    }
);
